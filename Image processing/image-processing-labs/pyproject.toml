[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "image-processing-labs"
version = "0.1.0"
description = "Student workspaces for the Image Processing laboratory course"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[dependency-groups]
dev = [
    "pillow>=11.0",
    "pytest>=8.3",
    "reportlab>=4.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["labs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".pytest_cache"]
